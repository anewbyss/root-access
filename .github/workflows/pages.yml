# Publishes the web app (web/) to GitHub Pages, plus RootAccess.swiftpm.zip (the Swift Playgrounds app) next to it.
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "RootAccess.swiftpm/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Package the Swift Playgrounds app
        run: zip -qr -X web/RootAccess.swiftpm.zip RootAccess.swiftpm -x "*/.DS_Store" "*/.build/*" "*/.swiftpm/*"
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4
